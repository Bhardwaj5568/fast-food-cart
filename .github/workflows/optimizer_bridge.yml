name: Send to CI/CD Optimizer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  send-to-optimizer:
    runs-on: ubuntu-latest
    steps:
      - name: Send pipeline data to optimizer
        run: |
          curl -X POST "${{ secrets.OPTIMIZER_BASE_URL }}/webhooks/github-actions" \
            -H "Content-Type: application/json" \
            -H "X-API-Key: ${{ secrets.OPTIMIZER_API_KEY }}" \
            -H "X-Role: ${{ secrets.OPTIMIZER_ROLE }}" \
            -H "X-GitHub-Delivery: gh-${{ github.run_id }}" \
            -d '{
              "repository": "${{ github.repository }}",
              "repository_id": "${{ github.repository_id }}",
              "branch": "${{ github.ref_name }}",
              "sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "actor": "${{ github.actor }}",
              "workflow_run": {
                "id": ${{ github.run_id }},
                "head_branch": "${{ github.ref_name }}",
                "head_sha": "${{ github.sha }}",
                "repository_id": "${{ github.repository_id }}"
              },
              "jobs": [
                {"name": "build",  "status": "completed", "duration_ms": 30000},
                {"name": "test",   "status": "completed", "duration_ms": 45000},
                {"name": "lint",   "status": "completed", "duration_ms": 8000},
                {"name": "deploy", "status": "completed", "duration_ms": 15000}
              ]
            }'
